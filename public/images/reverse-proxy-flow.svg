<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="auto" fill="none">
  <rect width="800" height="320" rx="12" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1.5"/>
  
  <!-- Client Block -->
  <rect x="40" y="110" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <circle cx="65" cy="135" r="4" fill="#00BB7F"/>
  <text x="80" y="140" fill="#1C212B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Client / Browser</text>
  <text x="60" y="170" fill="#677084" font-family="ui-monospace, monospace" font-size="12">HTTPS / TCP 443</text>
  <text x="60" y="190" fill="#677084" font-family="ui-monospace, monospace" font-size="12">TLS Handshake</text>

  <!-- Arrow 1 -->
  <path d="M200 160 H280" stroke="#1C212B" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="280,155 290,160 280,165" fill="#1C212B"/>
  <text x="215" y="150" fill="#677084" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Public Traffic</text>

  <!-- Edge Proxy Block -->
  <rect x="300" y="90" width="200" height="140" rx="8" fill="#FFFFFF" stroke="#1C212B" stroke-width="2"/>
  <circle cx="325" cy="115" r="4" fill="#00BB7F"/>
  <text x="340" y="120" fill="#1C212B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">Reverse Proxy</text>
  <text x="325" y="150" fill="#677084" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Automatic Let's Encrypt</text>
  <text x="325" y="172" fill="#677084" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Header Rewriting &amp; Gzip</text>
  <text x="325" y="195" fill="#00BB7F" font-family="ui-monospace, monospace" font-size="12">Zero-Trust Perimeter</text>

  <!-- Arrow 2 -->
  <path d="M500 160 H580" stroke="#1C212B" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="580,155 590,160 580,165" fill="#1C212B"/>
  <text x="515" y="150" fill="#677084" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Internal Mesh</text>

  <!-- Backend Upstream Block -->
  <rect x="600" y="110" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <circle cx="625" cy="135" r="4" fill="#677084"/>
  <text x="640" y="140" fill="#1C212B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">App Services</text>
  <text x="625" y="170" fill="#677084" font-family="ui-monospace, monospace" font-size="12">127.0.0.1:3000</text>
  <text x="625" y="190" fill="#677084" font-family="ui-monospace, monospace" font-size="12">Isolated Docker Net</text>
</svg>
